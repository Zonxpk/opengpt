[project]
name = "opengpt"
version = "0.1.0"
description = "ChatGPT Developer Mode MCP bridge over OpenHarness tools"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["chatgpt-mcp"]

[tool.uv.workspace]
members = ["packages/chatgpt-mcp"]

[tool.uv.sources]
chatgpt-mcp = { workspace = true }
openharness-ai = { path = "upstreams/openharness", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/chatgpt-mcp/tests"]
asyncio_mode = "auto"
