[project]
name = "chatgpt-mcp"
version = "0.1.0"
description = "Streamable HTTP MCP adapter for OpenHarness tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
    "pydantic>=2.0.0",
    "openharness-ai",
]

[project.scripts]
opengpt-connect = "chatgpt_mcp.connect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatgpt_mcp"]
